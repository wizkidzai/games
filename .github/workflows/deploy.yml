name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Only one deployment can run at a time; never cancel a running deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build kiosk and games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Make marketing-assets available to Vite's publicDir (../../public) at build time.
      # Each game's publicDir points to the monorepo root public/, so this copy
      # makes /marketing-assets/* resolve correctly in every game's production build.
      - name: Copy marketing-assets into public/
        run: |
          if [ -d marketing-assets ] && [ -n "$(ls -A marketing-assets)" ]; then
            cp -r marketing-assets public/marketing-assets
            echo "Copied marketing-assets → public/marketing-assets"
          else
            echo "marketing-assets submodule is empty or missing — skipping copy"
          fi

      # booth-kiosk is the site root — it fetches gameRegistry.json at runtime
      # and links to /games/<id>/ for each game, so it's the game-selection menu.
      - name: Build booth-kiosk
        run: pnpm --filter booth-kiosk run build

      # Base path must match the deployed sub-directory so asset URLs resolve
      # correctly at games.wizkidz.ai/games/<game-id>/.
      - name: Build games
        run: pnpm --filter "./games/*" run build

      # Assemble one flat directory that GitHub Pages will serve:
      #   /              ← apps/booth-kiosk/dist/ (game-selection menu)
      #   /games/<id>/   ← games/<id>/dist/, for every game directory
      #   /CNAME         ← tells GitHub Pages which custom domain to serve
      - name: Assemble site
        run: |
          mkdir -p gh-pages/games
          cp -r apps/booth-kiosk/dist/. gh-pages/

          for game_dir in games/*/; do
            game_id="$(basename "$game_dir")"
            cp -r "$game_dir/dist" "gh-pages/games/$game_id"
          done

          echo "games.wizkidz.ai" > gh-pages/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

  deploy:
    name: Deploy to Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
